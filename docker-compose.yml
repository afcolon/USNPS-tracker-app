services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: usnps
      POSTGRES_PASSWORD: usnps
      POSTGRES_DB: usnps_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usnps -d usnps_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
